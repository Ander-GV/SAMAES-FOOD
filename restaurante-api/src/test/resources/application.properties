spring.application.name=restaurante-api-test

# Base de datos en memoria H2 para pruebas automatizadas
spring.datasource.url=jdbc:h2:mem:restaurantedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cache deshabilitado en pruebas o simple
spring.cache.type=none
