# =======================================================
# CONFIGURACIÓN PARA PRODUCCIÓN (NEON DB POSTGRESQL + SPRING BOOT)
# =======================================================
spring.application.name=restaurante-api

# Conexión JDBC a Neon DB via Variables de Entorno (o por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-example.us-east-2.aws.neon.tech/samaes_db?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:samaes_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:samaes_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate para PostgreSQL en Neon
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Límite de tamaño para la carga de imágenes en Base64 o Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración JWT (Expiración de Sesión a las 12 horas)
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:43200000}
